# =========================================================
#  DEFAULT (local development) — uses in-memory H2 database
#  Run with: ./mvnw spring-boot:run
# =========================================================
spring.application.name=banking-system

# H2 in-memory DB: nothing to install, resets on restart
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Visit http://localhost:8080/h2-console to inspect the DB (JDBC URL: jdbc:h2:mem:bankdb)
spring.h2.console.enabled=true

# JWT settings (override the secret in production via env var!)
app.jwt.secret=${JWT_SECRET:change-this-in-production-this-must-be-at-least-32-bytes-long-secret}
app.jwt.expiration-ms=86400000

# CORS — your frontend origin (override in prod)
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

server.port=${PORT:8080}
