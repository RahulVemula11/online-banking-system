# =========================================================
#  PRODUCTION profile — uses PostgreSQL
#  Activated by setting env var: SPRING_PROFILES_ACTIVE=prod
#  Render/Railway inject DATABASE_URL automatically.
# =========================================================

# Render provides DATABASE_URL like: postgresql://user:pass@host:5432/dbname
# Spring needs the jdbc: prefix, so we read individual vars instead.
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

server.port=${PORT:8080}
