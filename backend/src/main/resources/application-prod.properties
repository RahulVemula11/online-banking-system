# =========================================================
#  PRODUCTION profile — PostgreSQL on Render
#  The DataSource itself is built in DataSourceConfig.java (it parses
#  Render's DATABASE_URL and adds SSL). So we do NOT set datasource.url here.
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
server.port=${PORT:8080}
