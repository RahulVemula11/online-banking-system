# Render.com Blueprint — provisions the Spring Boot backend + a free Postgres DB.
services:
  - type: web
    name: aegis-bank-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      # Give the entrypoint script the RAW connection string (postgresql://...).
      # The script converts it into the jdbc: form + splits out user/password.
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-bank-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
databases:
  - name: aegis-bank-db
    plan: free
